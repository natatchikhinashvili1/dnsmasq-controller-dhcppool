  names:
    kind: DhcpPool
    listKind: DhcpPoolList
    plural: dhcppools
    singular: dhcppool
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.controller
          name: Controller
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
