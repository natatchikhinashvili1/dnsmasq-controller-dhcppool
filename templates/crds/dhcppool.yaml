{{- if .Values.crds.install -}}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.8.0
  name: dhcppools.dnsmasq.kvaps.cf
  labels:
    {{- include "dnsmasq-controller.labels" . | nindent 4 }}
spec:
  group: dnsmasq.kvaps.cf
  names:
    kind: DhcpPool
    listKind: DhcpPoolList
    plural: dhcppools
    singular: dhcppool
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .spec.controller
          name: Controller
          type: string
        - jsonPath: .status.ready
          name: Ready
          type: boolean
        - jsonPath: .status.poolCount
          name: PoolCount
          type: integer
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: DhcpPool is the Schema for the dhcppools API
          properties:
            apiVersion:
              description: 'APIVersion defines the versioned schema of this representation
                of an object. Servers should convert recognized schemas to the latest
                internal value, and may reject unrecognized values. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources'
              type: string
            kind:
              description: 'Kind is a string value representing the REST resource this
                object represents. Servers may infer this from the endpoint the client
                submits requests to. Cannot be updated. In CamelCase. More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds'
              type: string
            metadata:
              type: object
            spec:
              description: DhcpPoolSpec defines the desired state of DhcpPool
              properties:
                controller:
                  type: string
                pools:
                  items:
                    description: DhcpPoolEntry defines a single DHCP address range
                      for dnsmasq.
                    properties:
                      rangeStart:
                        description: Start IP address of the DHCP range.
                        pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
                        type: string
                      rangeEnd:
                        description: End IP address of the DHCP range.
                        pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
                        type: string
                      leaseTime:
                        description: Lease duration (e.g. 12h, 24h, infinite).
                        pattern: '^(\d+[smhd]|infinite)$'
                        type: string
                      netmask:
                        description: Network mask for the DHCP range.
                        pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
                        type: string
                      broadcast:
                        description: Broadcast address for the DHCP range.
                        pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
                        type: string
                      gateway:
                        description: Default gateway (router) for the DHCP range.
                        pattern: '^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$'
                        type: string
                      dhcpBoot:
                        description: "Raw dhcp-boot value appended after the pool tag (e.g. tag:ipxe,https://...)."
                        type: string
                      tag:
                        description: Tag to associate with this DHCP range.
                        type: string
                    required:
                      - rangeStart
                      - rangeEnd
                    type: object
                  type: array
                netboxImport:
                  description: Optional NetBox import configuration. When set, the controller
                    periodically fetches prefixes from NetBox and merges them into pools (add-only).
                  properties:
                    netboxURL:
                      description: NetBox API base URL.
                      type: string
                    token:
                      description: NetBox API token. Injected from Vault via kube-secrets at deploy time.
                      type: string
                    clusterType:
                      description: "Cluster type: admin or runtime."
                      enum:
                        - admin
                        - runtime
                      type: string
                    clusterName:
                      description: "Cluster name, e.g. a-qa-de-1."
                      type: string
                    region:
                      description: "Region to filter NetBox sites, e.g. qa-de-1."
                      type: string
                    syncInterval:
                      description: "How often to re-sync (e.g. 5m, 30m). Defaults to 5m."
                      pattern: '^\d+[smh]$'
                      type: string
                    leaseTime:
                      description: "Default DHCP lease time for imported entries. Defaults to 10m."
                      pattern: '^(\d+[smhd]|infinite)$'
                      type: string
                    roles:
                      description: NetBox prefix roles to import.
                      items:
                        properties:
                          roleID:
                            description: NetBox role ID for filtering prefixes.
                            type: integer
                          name:
                            description: Human-readable name for logging.
                            type: string
                        required:
                          - roleID
                          - name
                        type: object
                      type: array
                  required:
                    - netboxURL
                    - token
                    - clusterType
                    - clusterName
                    - region
                    - roles
                  type: object
              type: object
            status:
              description: DhcpPoolStatus defines the observed state of DhcpPool
              properties:
                ready:
                  type: boolean
                poolCount:
                  format: int32
                  type: integer
                configFile:
                  type: string
                error:
                  type: string
                lastNetBoxSync:
                  description: Timestamp of the last successful NetBox sync.
                  type: string
                importedCount:
                  description: Number of entries imported from NetBox.
                  format: int32
                  type: integer
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
