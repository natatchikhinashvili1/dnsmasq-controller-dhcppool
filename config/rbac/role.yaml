---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dnsmasq-controller
rules:
- apiGroups:
  - dnsmasq.kvaps.cf
  resources:
  - dhcphosts
  - dhcpoptions
  - dhcppools
  - dnshosts
  - dnsmasqoptions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dnsmasq.kvaps.cf
  resources:
  - dhcppools/status
  verbs:
  - get
  - patch
  - update
